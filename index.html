<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUSTOMER CARE — Главная</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FFFFFF;
      padding: 18px 20px 36px;
      color: #1F2429;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
    }

    /* Симметричная шапка без чёрной плашки */
    .hero-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 28px;
      padding: 10px 16px 32px;
    }

    /* Литое золото для боковых надписей в стиль букв на монете */
    .hero-word {
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(28px, 4.2vw, 48px);
      font-weight: 900;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      background: linear-gradient(
        180deg,
        #FFF2A6 0%,
        #F2C138 30%,
        #C98A14 60%,
        #8A5804 88%,
        #DFA826 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 0px #4A2E00)
              drop-shadow(0px 4px 7px rgba(55, 34, 0, 0.35));
      user-select: none;
    }

    .hero-word.left {
      text-align: right;
    }

    .hero-word.right {
      text-align: left;
    }

    /* Сцена для 3D-переворота монеты */
    .coin-scene {
      width: 184px;
      height: 184px;
      perspective: 1000px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .coin-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.34, 1.4, 0.64, 1);
      border-radius: 50%;
    }

    .coin-scene:hover .coin-card {
      filter: drop-shadow(0 14px 24px rgba(60, 40, 5, 0.32));
    }

    .coin-card.is-flipped {
      transform: rotateY(180deg);
    }

.coin-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Лицевая сторона: тень ложится строго по контуру самой монеты */
    .coin-front {
      background: transparent;
    }

    .coin-front img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      transform: scale(1.07);
      filter: drop-shadow(0 10px 18px rgba(30, 22, 5, 0.32));
    }

    /* Обратная сторона: с тенью на самом круге */
    .coin-back {
      transform: rotateY(180deg);
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.75) 0%, transparent 45%),
        radial-gradient(circle at 75% 80%, rgba(75, 82, 92, 0.55) 0%, transparent 55%),
        linear-gradient(145deg, #E6E9EE 0%, #B8BFC8 48%, #858D98 100%);
      border: 4px solid #D8DEE6;
      box-shadow:
        0 0 0 2px #5B616A,
        0 10px 22px rgba(30, 22, 5, 0.32),
        inset 0 0 0 5px #9FA6B0,
        inset 0 0 0 7px #4A5058,
        inset 0 4px 12px rgba(0, 0, 0, 0.45);
      padding: 16px;
      text-align: center;
      overflow: hidden;
    }

    /* Текстура металла на серебряной стороне */
    .coin-back::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: 0.28;
      mix-blend-mode: overlay;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='silverNoise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23silverNoise)'/%3E%3C/svg%3E");
    }

    /* Золотая отлитая надпись WORK 4 FUN на реверсе */
    .coin-back-text {
      position: relative;
      z-index: 1;
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 900;
      font-size: 23px;
      line-height: 1.18;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(
        180deg,
        #FFF3A8 0%,
        #F5C53A 32%,
        #C78812 65%,
        #875503 92%,
        #E0A924 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 1.5px 0px #3D2500)
              drop-shadow(0px 3px 4px rgba(35, 20, 0, 0.55));
    }

    .coin-back-text span {
      display: block;
      font-size: 29px;
      margin: 1px 0;
    }

    /* Список разделов меню */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Кнопки с точной текстурой античного золота и серебряно-тёмным кантом монеты */
    .menu-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      padding: 26px 32px;
      border-radius: 14px;
      overflow: hidden;
      /* Белая внешняя рамка + внутренний серебристо-тёмный ободок в стиль щита монеты */
      border: 2px solid #FFFFFF;
      background:
        radial-gradient(ellipse at 18% 20%, rgba(255, 232, 130, 0.45) 0%, transparent 50%),
        radial-gradient(ellipse at 82% 85%, rgba(82, 48, 0, 0.55) 0%, transparent 58%),
        radial-gradient(circle at 50% 50%, #D99B1E 0%, #B87B0E 65%, #8A5604 100%);
      box-shadow:
        0 6px 18px rgba(95, 60, 4, 0.24),
        0 0 0 1px #D5DAE0,
        inset 0 0 0 2px #C8CFD8,
        inset 0 0 0 3px #4D3508,
        inset 0 3px 10px rgba(255, 240, 175, 0.45),
        inset 0 -4px 12px rgba(55, 32, 0, 0.55);
      transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
    }

    /* Двухслойная зернистая текстура чеканного металла (как поле монеты) */
    .menu-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.34;
      mix-blend-mode: overlay;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='coinGrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23coinGrain)'/%3E%3C/svg%3E");
    }

    /* Лёгкие потёртости и патина металла */
    .menu-card::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.16;
      mix-blend-mode: multiply;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='patina'%3E%3CfeTurbulence type='turbulence' baseFrequency='0.04' numOctaves='3' seed='5'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23patina)'/%3E%3C/svg%3E");
    }

    .menu-card:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow:
        0 10px 26px rgba(95, 60, 4, 0.34),
        0 0 0 1px #B9922B,
        inset 0 0 0 2px #E2E7EE,
        inset 0 0 0 3px #4D3508,
        inset 0 3px 12px rgba(255, 246, 195, 0.65);
    }

    .card-content {
      position: relative;
      z-index: 1;
    }

    .card-num {
      display: block;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #E6EBF0;
      text-shadow: 0 1px 2px rgba(42, 24, 0, 0.9);
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #FFFFFF;
      text-shadow: 0 2px 4px rgba(42, 24, 0, 0.9), 0 0 1px rgba(42, 24, 0, 0.95);
    }

    .card-arrow {
      position: relative;
      z-index: 1;
      font-size: 28px;
      font-weight: 700;
      color: #F2F5F8;
      text-shadow: 0 2px 4px rgba(42, 24, 0, 0.9);
      transition: transform 0.22s ease;
    }

    .menu-card:hover .card-arrow {
      transform: translateX(5px);
    }

    @media (max-width: 680px) {
      .hero-header {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 12px;
      }
      .hero-word.left,
      .hero-word.right {
        text-align: center;
      }
      .coin-scene {
        margin: 0 auto;
        width: 156px;
        height: 156px;
      }
      .coin-back-text {
        font-size: 19px;
      }
      .coin-back-text span {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Шапка: CUSTOMER | Интерактивная 3D-монета | CARE -->
    <header class="hero-header">
      <div class="hero-word left">CUSTOMER</div>

      <div class="coin-scene" id="coinFlip" title="Нажмите, чтобы перевернуть монету">
        <div class="coin-card" id="coinCard">
          <!-- Лицевая сторона: твой PNG из репозитория GitHub -->
          <div class="coin-face coin-front">
            <img src="cc-logo.png" alt="CUSTOMER CARE" onerror="this.onerror=null; this.src='https://wiki.yandex.ru/homepage/.files/cc-1.png'; this.style.borderRadius='50%';">
          </div>

          <!-- Обратная сторона: серебро + литое золото WORK 4 FUN -->
          <div class="coin-face coin-back">
            <div class="coin-back-text">
              WORK
              <span>4</span>
              FUN
            </div>
          </div>
        </div>
      </div>

      <div class="hero-word right">CARE</div>
    </header>

    <!-- Разделы меню -->
    <nav class="menu-list">
      <a href="https://wiki.yandex.ru/homepage/metodichki/" target="_top" class="menu-card">
        <div class="card-content">
          <span class="card-num">01</span>
          <div class="card-title">МЕТОДИЧКИ</div>
        </div>
        <span class="card-arrow">›</span>
      </a>

      <a href="https://wiki.yandex.ru/homepage/instrumenty/" target="_top" class="menu-card">
        <div class="card-content">
          <span class="card-num">02</span>
          <div class="card-title">ИНСТРУМЕНТЫ</div>
        </div>
        <span class="card-arrow">›</span>
      </a>

      <a href="https://wiki.yandex.ru/homepage/kursy/" target="_top" class="menu-card">
        <div class="card-content">
          <span class="card-num">03</span>
          <div class="card-title">КУРСЫ</div>
        </div>
        <span class="card-arrow">›</span>
      </a>

      <a href="https://wiki.yandex.ru/homepage/rukovoditeljam/" target="_top" class="menu-card">
        <div class="card-content">
          <span class="card-num">04</span>
          <div class="card-title">ДЛЯ РОПА</div>
        </div>
        <span class="card-arrow">›</span>
      </a>
    </nav>
  </div>

  <script>
    const coinFlip = document.getElementById('coinFlip');
    const coinCard = document.getElementById('coinCard');

    coinFlip.addEventListener('click', function () {
      coinCard.classList.toggle('is-flipped');
    });
  </script>

</body>
</html>
